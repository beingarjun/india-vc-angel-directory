name: Data correction
description: Report a broken link or suggest a sourced correction.
title: "[Correction]: "
labels: [data-correction]
body:
  - type: input
    id: organization
    attributes:
      label: Organization
      placeholder: Organization name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source
      description: Link to the organization's official source.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Before submitting
      options:
        - label: This is a public organization-level source and contains no private personal data.
          required: true
